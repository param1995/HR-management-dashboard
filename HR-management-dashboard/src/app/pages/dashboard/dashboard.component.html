<div class="dashboard-container ">

    <div class="stats-grid">
        <div class="stat-card pending">
            Pending Tasks<span>{{ stats.pending }}</span>
        </div>
        <div class="stat-card completed">
            Completed Tasks<span>{{ stats.completed }}</span>
        </div>
        <div class="stat-card cancelled">
            Cancelled Tasks<span>{{ stats.cancelled }}</span>
        </div>
        <div class="stat-card approved">
            Approved Posts<span>{{ stats.approved }}</span>
        </div>
    </div>

    <div class="charts-row">
        <div class="chart-card">
            <h5>Employees by Department</h5>
        </div>

        <div class="chart-card">
            <h5>Monthly Attendance</h5>
        </div>
    </div>

    <div class="tables-row">
        <div class="recent-activity card">
            <h5>Recent Activity</h5>
            <ul>
                <li *ngFor="let act of recentActivity">{{ act }}</li>
            </ul>
        </div>
        <div class="birthdays card">
            <h5>Upcoming Birthdays</h5>
            <ul>
                <li *ngFor="let b of upcomingBirthdays">
                    {{ b.name }} – {{ b.dob | date : "dd MMM" }}
                </li>
            </ul>
        </div>
    </div>
</div>
