<div class="profile-form-wrapper mat-elevation-z4">
    <h2 class="form-title">My Profile</h2>

    <form *ngIf="!formSubmitted" [formGroup]="profileForm" (ngSubmit)="onSubmit()">
        <div class="form-grid">
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input matInput formControlName="email" type="email" placeholder="example@mail.com" />
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Gender</mat-label>
                <mat-select formControlName="gender">
                    <mat-option value="male">Male</mat-option>
                    <mat-option value="female">Female</mat-option>
                    <mat-option value="other">Other</mat-option>
                </mat-select>
            </mat-form-field>

            <!-- Date of Birth -->
            <mat-form-field appearance="outline">
                <mat-label>Date of Birth</mat-label>
                <input matInput [matDatepicker]="picker" formControlName="dob" placeholder="Choose a date" />
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Mobile No</mat-label>
                <input matInput formControlName="mobile" type="tel" maxlength="10" />
            </mat-form-field>
            <mat-form-field appearance="outline">
                <mat-label>Department</mat-label>
                <input matInput formControlName="department" placeholder="HR / IT / Sales" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Address</mat-label>
                <textarea matInput formControlName="address" rows="3" placeholder="Your address..."></textarea>
            </mat-form-field>
        </div>

        <div class="btn-row">
            <button mat-stroked-button type="button" (click)="profileForm.reset()">
        Reset
      </button>
            <button mat-raised-button color="primary" type="submit" [disabled]="profileForm.invalid">
        Update Profile
      </button>
        </div>
    </form>
    <div *ngIf="formSubmitted" class="success-message">
        ✅ Profile updated successfully!
    </div>
</div>
