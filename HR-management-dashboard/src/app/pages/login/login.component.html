<div class="login-page-wrapper">
    <div class="login-form-container">
        <div class="login-header-wrapper">
            <h2>Login</h2>
            <p>Sign in to continue.</p>
        </div>

        <mat-form-field appearance="outline" class="d-block mb-2">
            <mat-label>Username</mat-label>
            <input [(ngModel)]="loginObj.userName" matInput placeholder="Username" />
            <mat-error></mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="d-block mb-2">
            <mat-label>Password</mat-label>
            <input [(ngModel)]="loginObj.password" matInput placeholder="Password" />

            <mat-error></mat-error>
        </mat-form-field>

        <div class="d-flex justify-content-center">
            <button (click)="onLogin()" class="px-5" mat-raised-button color="primary">
        Login
      </button>
        </div>

        <div class="navigation-link">
            <b>Don't have an account?
        <a [routerLink]="['/auth/register']">Create new account</a></b
      >
    </div>
  </div>
</div>
